apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
  namespace: capstone-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
      version: green
  template:
    metadata:
      labels:
        app: app
        version: green
    spec:
      containers:
        - name: frontend
          image: REPLACE_WITH_IMAGE
          ports:
            - containerPort: 3000