apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  namespace: capstone-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
      version: blue
  template:
    metadata:
      labels:
        app: app
        version: blue
    spec:
      containers:
        - name: frontend 
          image: REPLACE_WITH_IMAGE
          ports:
            - containerPort: 3000