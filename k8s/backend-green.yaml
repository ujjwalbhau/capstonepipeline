apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-green
  namespace: capstone-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      version: green
  template:
    metadata:
      labels:
        app: backend
        version: green
    spec:
      containers:
        - name: backend
          image: REPLACE_WITH_IMAGE
          ports:
            - containerPort: 3000