name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - dev
     

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}
      tag: ${{ steps.set-image.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          ACR_LOGIN_SERVER="${ACR_LOGIN_SERVER}"
          echo "ACR_LOGIN_SERVER: capstoneacr123.azurecr.io"
          echo "ACR_LOGIN_SERVER: ${ACR_LOGIN_SERVER}"
          
          SHORT_SHA=$(echo "${{ github.run_number}}" | cut -c1-7)
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
          TAG="${BRANCH}-${SHORT_SHA}"
          IMAGE="${ACR_LOGIN_SERVER}/frontend:${TAG}"
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "Final IMAGE: ${IMAGE}"

      - name: Debug show set-image outputs
        run: echo "DEBUG image ${{ steps.set-image.outputs.image }}" && echo "DEBUG tag ${{ steps.set-image.outputs.tag }}"

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ./app
          push: true
          tags: ${{ steps.set-image.outputs.image }}
          

      - name: Trivy scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.set-image.outputs.image }}
          format: 'table'
          scan-type: 'image'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: true

      - name: Persist image name to artifact
        run: |
          echo "${{ steps.set-image.outputs.image }}" > image.txt
          cat image.txt
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-image
          path: image.txt


      

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build image artifact (if present)
        uses: actions/download-artifact@v4
        with:
          name: build-image
          path: .

      - name: Debug show build-and-push job outputs
        run: |
          echo "DEBUG: needs.build-and-push.outputs.image='${{ needs.build-and-push.outputs.image }}'"
          echo "DEBUG: needs.build-and-push.outputs.tag='${{ needs.build-and-push.outputs.tag }}'"

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS credentials
        uses: azure/aks-set-context@v2
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Apply namespace & service
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/frontend-svc.yaml

      - name: Blue-Green Deployment
        run: |
          NS="capstone-project"

          CURRENT=$(kubectl -n $NS get svc frontend-lb -o jsonpath='{.spec.selector.version}')
          echo "Current version: $CURRENT"

          if [ "$CURRENT" = "blue" ]; then
            NEXT="green"
          else
            NEXT="blue"
          fi

          echo "Deploying NEW version: $NEXT"

          IMAGE="${{ needs.build-and-push.outputs.image }}"
          if [ -f image.txt ]; then
            IMAGE="$(cat image.txt)"
        
          sed "s|REPLACE_WITH_IMAGE|$IMAGE|g" k8s/frontend-$NEXT.yaml > /tmp/frontend.yaml
          kubectl apply -f /tmp/frontend.yaml
          kubectl -n $NS rollout status deployment/app-$NEXT --timeout=120s
          fi

          if [ $? -ne 0 ]; then
            echo " Deployment failed → keeping old version"
            kubectl -n $NS delete deployment app-$NEXT
            exit 1
          fi

          echo "Deployment successful → switching traffic"

          kubectl -n $NS patch svc frontend-lb \
            -p "{\"spec\":{\"selector\":{\"app\":\"app\",\"version\":\"$NEXT\"}}}"

          echo " Traffic switched to $NEXT"

     